name: Awaken
on:
  schedule:
    - cron: "10 17 * * *" # 00:10 in UTC+7; the configurator works this out for your zone
  workflow_dispatch:
  push:
    branches: [main]
    paths: [awaken.json]
permissions:
  contents: write
jobs:
  awaken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zyr-ai/git-profile-awaken@main
